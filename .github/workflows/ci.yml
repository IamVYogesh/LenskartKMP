name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  jvm-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (desktop JVM target runs commonTest + desktopTest)
        run: ./gradlew desktopTest --stacktrace
      - name: Build Android debug APK
        run: ./gradlew :composeApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: debug-apk, path: composeApp/build/outputs/apk/debug/*.apk }

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin/Native tests on the iOS simulator
        run: ./gradlew iosSimulatorArm64Test
      - name: Link iOS framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
